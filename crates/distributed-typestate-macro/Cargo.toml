[package]
name = "distributed-typestate-macro"
version = "0.1.0"
edition = "2024"
description = "Procedural macros for the dist-typestate crate. Generates type-safe distributed state machines."
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
