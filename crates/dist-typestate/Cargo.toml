[package]
name = "dist-typestate"
version = "0.1.0"
edition = "2024"
description = "Type-safe distributed state machines using versioned capabilities and CAS. Bring Rust's typestate pattern to distributed systems."
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
rusqlite = { version = "0.35", features = ["bundled"] }
distributed-typestate-macro = { version = "0.1.0", path = "../distributed-typestate-macro" }